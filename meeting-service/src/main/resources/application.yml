spring:
  application:
    name: meeting-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/meetings}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: meeting_service

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    default-schema: meeting_service
    create-schemas: true
    table: flyway_schema_history_meeting

# ── JWT ─────────────────────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET}

# ── Application ──────────────────────────────────────────────────────────────
app:
  frontend-url: ${FRONTEND_URL:https://www.vaarta.site}
  notification-service-url: ${NOTIFICATION_SERVICE_URL:http://notification-service:8080}
  ai-service-url: ${AI_SERVICE_URL:http://ai-service:8000}
  auth-service-url: ${AUTH_SERVICE_URL:http://auth-service:8080}
  internal-api-key: ${INTERNAL_API_KEY:internal_dev_key_123}

server:
  port: 8080
  error:
    include-message: always
