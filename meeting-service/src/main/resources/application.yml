spring:
  cloud:
    azure:
      keyvault:
        secret:
          property-sources[0]:
            endpoint: https://vaarta-vault-prod.vault.azure.net/
            credential:
              managed-identity-enabled: true
              client-id: ${AZURE_CLIENT_ID:7a145cce-7fcd-49b1-8813-48647598fe22}
  application:
    name: meeting-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://vaarta-db-v2.postgres.database.azure.com:5432/postgres}
    username: ${DB_USER:dbadmin}
    password: ${DB-PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: meeting_service

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    default-schema: meeting_service
    create-schemas: true
    table: flyway_schema_history_meeting

  # Caching disabled — see note below.
  #
  # The two @Cacheable annotations in MeetingService (by id, by joinCode) are
  # primary-key lookups. At current traffic they do not justify a managed Redis
  # instance, so Redis has been removed.
  #
  # If caching is needed again, do NOT use `type: simple` —
  # ConcurrentMapCacheManager ignores time-to-live, so entries never expire and
  # stale meetings would be served indefinitely. Use Caffeine with an explicit
  # expireAfterWrite, or reinstate Redis.
  cache:
    type: none

# ── JWT ─────────────────────────────────────────────────────────────────────
jwt:
  secret: ${JWT-SECRET}

# ── Application ──────────────────────────────────────────────────────────────
app:
  frontend-url: ${FRONTEND_URL:https://www.vaarta.site}
  notification-service-url: ${NOTIFICATION_SERVICE_URL:https://notification-service.internal.vaarta-env.azurecontainerapps.io}
  ai-service-url: ${AI_SERVICE_URL:https://ai-service.internal.vaarta-env.azurecontainerapps.io}
  auth-service-url: ${AUTH_SERVICE_URL:https://auth-service.jollystone-d8b7ca7f.eastus.azurecontainerapps.io}
  internal-api-key: ${INTERNAL-API-KEY}

server:
  port: 8080
  error:
    include-message: always

# ── LiveKit ──────────────────────────────────────────────────────────────────
livekit:
  api:
    key: ${LIVEKIT-API-KEY}
    secret: ${LIVEKIT-API-SECRET}
  url: ${LIVEKIT_URL:wss://vaarta-gtmvkch7.livekit.cloud}

# ── Logging ──────────────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.vaarta: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - [%X{requestId}] - %msg%n"
