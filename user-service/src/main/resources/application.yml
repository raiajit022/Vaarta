spring:
  cloud:
    azure:
      keyvault:
        secret:
          property-sources[0]:
            endpoint: https://vaarta-vault-prod.vault.azure.net/
            credential:
              managed-identity-enabled: true
              # Required: the identity is user-assigned, so MSI must be told
              # which one to use or the token request returns HTTP 400.
              client-id: ${AZURE_CLIENT_ID:7a145cce-7fcd-49b1-8813-48647598fe22}
  application:
    name: user-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://vaarta-db-v2.postgres.database.azure.com:5432/postgres}
    username: ${DB_USER:dbadmin}
    password: ${DB-PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: user_service

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    table: flyway_schema_history_user
    default-schema: user_service
    create-schemas: true

# ── JWT ─────────────────────────────────────────────────────────────────────
jwt:
  secret: ${JWT-SECRET}

# ── Application ──────────────────────────────────────────────────────────────
app:
  internal-key: ${INTERNAL-API-KEY}

server:
  port: 8080
  error:
    include-message: always
