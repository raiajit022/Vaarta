spring:
  application:
    name: notification-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/notifications}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_schema: notification_service
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    default-schema: notification_service
    create-schemas: true
    table: flyway_schema_history_notification

server:
  port: 8080

resend:
  api-key: ${RESEND_API_KEY}
  from-address: ${RESEND_FROM_ADDRESS:notifications@vaarta.site}

app:
  internal-api-key: ${INTERNAL_API_KEY}
  frontend-url: ${FRONTEND_URL:https://www.vaarta.site}
